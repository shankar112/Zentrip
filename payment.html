<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenTrip — Payment</title>
    <meta name="description" content="Securely pay for your ZenTrip booking." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container py-4">
      <h1 class="h4 mb-3">Payment</h1>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="p-3 p-md-4 rounded-4 border shadow-sm">
            <h2 class="h6">Card Details</h2>
            <form id="paymentForm" class="mt-3">
              <div class="mb-3">
                <label class="form-label" for="cardNumber">Card number</label>
                <input class="form-control" id="cardNumber" inputmode="numeric" placeholder="4242 4242 4242 4242" required />
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="cardExpiry">Expiry</label>
                  <input class="form-control" id="cardExpiry" placeholder="MM/YY" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="cardCvc">CVC</label>
                  <input class="form-control" id="cardCvc" inputmode="numeric" placeholder="123" required />
                </div>
              </div>
              <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="saveCard" />
                <label class="form-check-label" for="saveCard">Save card for future trips</label>
              </div>
              <div class="d-grid mt-3">
                <button class="btn btn-primary" type="submit">Pay Now</button>
              </div>
            </form>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="p-3 p-md-4 rounded-4 border shadow-sm">
            <h2 class="h6">Total</h2>
            <div id="pay-summary" class="small"></div>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="assets/js/payments.js"></script>
  </body>
  </html>
