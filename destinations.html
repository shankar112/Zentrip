<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenTrip — Destinations</title>
    <meta name="description" content="Browse ZenTrip's curated destinations and serene retreats." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container py-4">
      <h1 class="h3 mb-3">Destinations</h1>
      <form id="filters" class="row g-2 align-items-end mb-3">
        <div class="col-12 col-md-4">
          <label for="search" class="form-label">Search</label>
          <input id="search" type="search" class="form-control" placeholder="e.g., Bali, Alps" />
        </div>
        <div class="col-6 col-md-3">
          <label for="tag" class="form-label">Vibe</label>
          <select id="tag" class="form-select">
            <option value="">Any</option>
            <option value="beach">Beach</option>
            <option value="mountain">Mountain</option>
            <option value="city">City</option>
            <option value="wellness">Wellness</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label for="sort" class="form-label">Sort</label>
          <select id="sort" class="form-select">
            <option value="pop">Most popular</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top rated</option>
          </select>
        </div>
        <div class="col-12 col-md-2 d-grid">
          <button class="btn btn-primary" id="applyFilters" type="button">Apply</button>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <p class="m-0 small text-muted" id="resultCount">Loading...</p>
        <button class="btn btn-sm btn-outline-secondary" id="clearFilters" type="button">Clear</button>
      </div>

      <div id="results" class="row g-4" aria-live="polite"></div>
      <div class="text-center mt-4">
        <button class="btn btn-outline-primary d-none" id="loadMore" type="button">Load more</button>
      </div>
    </main>

    <footer id="site-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="assets/js/search.js"></script>
  </body>
  </html>
