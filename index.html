<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenTrip — Find Your Calm Escape</title>
    <meta name="description" content="ZenTrip helps you discover serene destinations and book peaceful getaways with ease." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main">
      <section class="hero container-fluid d-flex align-items-center justify-content-center text-center">
        <div class="hero-inner">
          <h1 class="display-4 fw-bold fade-up">Find Your Calm Escape</h1>
          <p class="lead mb-4 fade-up delay-1">Curated trips to serene destinations, tailored for your pace.</p>
          <form class="search-bar shadow-sm fade-up delay-2" action="destinations.html">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-md-4">
                <label class="visually-hidden" for="q">Destination</label>
                <input id="q" name="q" type="search" class="form-control form-control-lg" placeholder="Search destinations (e.g., Bali)" />
              </div>
              <div class="col-6 col-md-3">
                <label class="visually-hidden" for="date">Dates</label>
                <input id="date" name="date" type="text" class="form-control form-control-lg" placeholder="Anytime" />
              </div>
              <div class="col-6 col-md-3">
                <label class="visually-hidden" for="guests">Guests</label>
                <input id="guests" name="guests" type="number" min="1" class="form-control form-control-lg" placeholder="2 guests" />
              </div>
              <div class="col-12 col-md-2 d-grid">
                <button class="btn btn-primary btn-lg" type="submit">Search</button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <section class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 m-0">Popular Retreats</h2>
          <a class="link-primary" href="destinations.html">See all</a>
        </div>
        <div id="popular-grid" class="row g-4" aria-live="polite"></div>
      </section>

      <section class="container my-5">
        <div class="p-4 rounded-4 bg-gradient zen-gradient text-white position-relative overflow-hidden">
          <div class="row align-items-center">
            <div class="col-lg-8">
              <h3 class="h4 mb-2">Travel lighter, breathe deeper</h3>
              <p class="mb-0">Flexible plans, transparent pricing, and support whenever you need it.</p>
            </div>
            <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
              <a href="booking.html" class="btn btn-outline-light">Start a Booking</a>
            </div>
          </div>
          <div class="float-shape"></div>
        </div>
      </section>
    </main>

    <footer id="site-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="assets/js/main.js"></script>
  </body>
  </html>
