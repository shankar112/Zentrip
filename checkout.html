<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenTrip — Checkout</title>
    <meta name="description" content="Review your ZenTrip selection and enter traveler details." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container py-4">
      <h1 class="h4 mb-3">Checkout</h1>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="p-3 p-md-4 rounded-4 border shadow-sm">
            <h2 class="h6">Traveler Details</h2>
            <form id="travelerForm" class="mt-3">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="firstName">First name</label>
                  <input class="form-control" id="firstName" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="lastName">Last name</label>
                  <input class="form-control" id="lastName" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="email">Email</label>
                  <input class="form-control" id="email" type="email" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="phone">Phone</label>
                  <input class="form-control" id="phone" type="tel" placeholder="+1 555 000 1234" />
                </div>
              </div>
              <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="agree" required />
                <label class="form-check-label" for="agree">I agree to the Terms</label>
              </div>
              <div class="d-grid mt-3">
                <button class="btn btn-primary" type="submit">Proceed to Payment</button>
              </div>
            </form>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="p-3 p-md-4 rounded-4 border shadow-sm">
            <h2 class="h6">Order Summary</h2>
            <div id="summary" class="small"></div>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="assets/js/cart.js"></script>
  </body>
  </html>
