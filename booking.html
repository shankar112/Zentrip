<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenTrip — Booking Form</title>
    <meta name="description" content="Complete your ZenTrip booking with dates and preferences." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container py-4">
      <h1 class="h4 mb-3">Booking Form</h1>
      <div class="row g-4">
        <div class="col-lg-7">
          <form id="bookingForm" class="p-3 p-md-4 rounded-4 border shadow-sm">
            <div class="mb-3">
              <label class="form-label" for="tripSelect">Select trip</label>
              <select id="tripSelect" class="form-select"></select>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="bkDate">Date</label>
                <input id="bkDate" type="date" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="bkGuests">Guests</label>
                <input id="bkGuests" type="number" min="1" value="2" class="form-control" required />
              </div>
            </div>
            <div class="mt-3">
              <label class="form-label" for="bkNotes">Notes (optional)</label>
              <textarea id="bkNotes" class="form-control" rows="3" placeholder="Special requests, preferences..."></textarea>
            </div>
            <div class="d-grid mt-3">
              <button class="btn btn-primary" type="submit">Get Quote</button>
            </div>
          </form>
        </div>
        <div class="col-lg-5">
          <div class="p-3 p-md-4 rounded-4 border shadow-sm">
            <h2 class="h6">Instant Quote</h2>
            <div id="quote" class="small"></div>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="assets/js/booking.js"></script>
  </body>
  </html>
