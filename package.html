<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenTrip — Package Details</title>
    <meta name="description" content="Trip details, itinerary, and inclusions for your ZenTrip package." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="container py-4">
      <div id="pdp" class="row g-4">
        <div class="col-lg-7">
          <div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-sm">
            <img id="pdp-hero" alt="Destination" loading="lazy" />
          </div>
          <div class="mt-3" id="pdp-desc"></div>
          <div class="mt-4">
            <h2 class="h5">What’s Included</h2>
            <ul class="small" id="pdp-includes"></ul>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="p-3 p-md-4 rounded-4 border shadow-sm sticky-lg-top" style="top: 90px;">
            <h1 id="pdp-title" class="h4 mb-1">Loading...</h1>
            <p id="pdp-meta" class="text-muted small mb-3"></p>
            <p class="fs-4 fw-bold mb-3" id="pdp-price"></p>
            <div class="row g-2 mb-3">
              <div class="col">
                <label class="form-label small" for="pdp-date">Date</label>
                <input id="pdp-date" class="form-control" type="date" />
              </div>
              <div class="col">
                <label class="form-label small" for="pdp-guests">Guests</label>
                <input id="pdp-guests" class="form-control" type="number" min="1" value="2" />
              </div>
            </div>
            <button id="addToCart" class="btn btn-primary w-100 mb-2" type="button">Book Now</button>
            <a href="destinations.html" class="btn btn-outline-secondary w-100" role="button">Back to Destinations</a>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="mt-auto"></footer>

    <script type="application/ld+json" id="pdp-schema"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="assets/js/cart.js"></script>
  </body>
  </html>
